extends: '@panates/rman-preset'

group: false

version:
  cascade: group
  # A dependent is not released, nor its range rewritten, while a sibling's
  # new version is inside the range it declares; outside it, version fails
  dependentRanges: keep

changelog:
  groupBy: package

# The modules are not published to npm: their home is the SyncBridge registry.
# rman asks it (`spm view`) which version a module lacks and publishes it with
# the repository's own spm (@syncbridge/syncbuild); in GitHub Actions as the
# job, with its OIDC token. rman still bumps the versions, tags them and writes
# the GitHub Release
'[*]':
  publish:
    target: [spm]
    spm:
      access: public
