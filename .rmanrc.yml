extends: '@panates/rman-preset'

group: false

# The repository installs with pnpm. rman reads it from the lockfile as well,
# but a lockfile is a result, not the decision
packageManager:
  node: pnpm

version:
  cascade: group
  # A dependent is not released, nor its range rewritten, while a sibling's
  # new version is inside the range it declares; outside it, version fails
  dependentRanges: keep

changelog:
  groupBy: package

# The modules are not published to npm: their home is the SyncBridge registry.
# rman asks it (`spm view`) which version a module lacks and publishes it with
# the repository's own spm (@syncbridge/syncbuild); in GitHub Actions as the
# job, with its OIDC token. rman still bumps the versions, tags them and writes
# the GitHub Release
'[*]':
  run:
    test:
      # Packed, installed as the engine does and its classes loaded in a worker:
      # what a test in the project cannot catch (an undeclared dependency, a
      # missing worker permission)
      before: pnpm exec spm verify
  publish:
    target: [spm]
    spm:
      access: public
      # The same, right before spm publishes it, for the modules being released
      before: pnpm exec spm verify
