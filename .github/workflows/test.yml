name: Test
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/test.yml'
      - 'packages/**/*.ts'
      - 'packages/**/*.js'
      - 'packages/**/*.cjs'
      - 'packages/**/*.mjs'
      - '**/package.json'
      - '**/tsconfig*.json'
      - '**/.mocharc.*'
      - '.c8rc.json'
      - 'package-lock.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Tests'
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      (
        github.event_name == 'push' &&
        !contains(github.event.head_commit.message, 'no-test')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Setup Environment
        uses: panates/gh-setup-node@v2
        with:
          node-version: '24'
          rman-version: '2'
          install: 'ci'

      # Each module's tests, and before them `spm verify` (.rmanrc.yml
      # run.test.before): packed, installed as the engine does and its classes
      # loaded. spm compiles a module against the others' build output
      - name: Apply tests
        run: |
          rman check
          rman lint
          npx tsc -b tsconfig-test.json --noEmit
          rman build
          rman run test
