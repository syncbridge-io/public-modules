name: Release
on:
  workflow_dispatch:
    inputs:
      skip-tests:
        description: Skip test
        type: boolean
        default: false

  # The version is decided in the release job from Conventional Commits
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  source:
    uses: panates/github-actions/.github/workflows/pr-source.yaml@v3
    permissions:
      contents: read
      pull-requests: read

  test:
    needs: [source]
    if: >
      !contains(github.event.head_commit.message, 'no-release') &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip-tests != 'true') ||
        (
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, 'no-test') &&
          needs.source.outputs.head-ref != 'dev'
        )
      )
    uses: ./.github/workflows/test.yml

  # Before the version is bumped: `rman version --push` pushes the bump and its
  # tags, and a failure after it would leave a version that was never released.
  # Not skipped with the tests
  verify:
    needs: [source, test]
    if: >
      always() && !cancelled() &&
      needs.source.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      !contains(github.event.head_commit.message, 'no-release')
    uses: ./.github/workflows/verify.yml

  release:
    needs: [source, test, verify]
    if: >
      always() && !cancelled() &&
      needs.source.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.verify.result == 'success' &&
      !contains(github.event.head_commit.message, 'no-release')
    uses: panates/github-actions/.github/workflows/node-release.yaml@v3
    # The modules are published with provenance: each registered on npm with
    # this repository as its Trusted Publisher
    permissions:
      id-token: write
      contents: write
    secrets:
      # Until all nine are registered as Trusted Publishers
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The same versions to the SyncBridge registry, where they appear in the
  # Marketplace and can be installed on SyncBridge servers. After the npm
  # publish. `--skip-existing` makes it safe to run again: a module whose
  # version the registry has is left alone, so it also finishes a release whose
  # registry step failed (run the workflow by hand: a push that released
  # nothing does not come here).
  # Only when the repository variable SB_REGISTRY_PUBLISH is 'true': the
  # registry's cloud is not deployed yet.
  # The organization's Trusted publishers in Console must trust this repository
  # and this workflow file; the job's OIDC token is all it publishes with.
  registry:
    needs: [release]
    if: >
      vars.SB_REGISTRY_PUBLISH == 'true' &&
      always() && !cancelled() &&
      needs.release.result == 'success' &&
      (needs.release.outputs.released == 'true' ||
        github.event_name == 'workflow_dispatch')
    name: Registry ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    strategy:
      # In the order their peers need: builtins, then the rest
      max-parallel: 1
      fail-fast: false
      matrix:
        package:
          - builtins
          - hl7
          - kafka
          - redis
          - sqb
          - serialport
          - ngrok
          - pinggy
    steps:
      # The branch as the release left it, with the versions it bumped: not the
      # commit this run started from. A commit pushed meanwhile comes with it;
      # the concurrency group keeps another release from starting before this
      # one is done
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Publish
        working-directory: packages/${{ matrix.package }}
        run: npx spm publish --access public --skip-existing
