name: Release
on:
  workflow_dispatch:
    inputs:
      skip-tests:
        description: Skip test
        type: boolean
        default: false

  # The version is decided in the release job from Conventional Commits
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  source:
    uses: panates/github-actions/.github/workflows/pr-source.yaml@v3
    permissions:
      contents: read
      pull-requests: read

  test:
    needs: [source]
    if: >
      !contains(github.event.head_commit.message, 'no-release') &&
      (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.skip-tests != 'true') ||
        (
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, 'no-test') &&
          needs.source.outputs.head-ref != 'dev'
        )
      )
    uses: ./.github/workflows/test.yml

  release:
    needs: [source, test]
    if: >
      always() && !cancelled() &&
      needs.source.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      !contains(github.event.head_commit.message, 'no-release')
    uses: panates/github-actions/.github/workflows/node-release.yaml@v3
    # Version, tags, build, then `rman publish`: to the SyncBridge registry with
    # spm (the `spm` target of .rmanrc.yml), not to npm, and the GitHub Release.
    # `spm verify` runs right before each module is published
    # (publish.spm.before); one that fails it is not published.
    # In Actions spm publishes as this job, with its OIDC token, so the job
    # needs id-token: write; the registry's Console has to trust this
    # repository and this workflow file ("CI may create packages" on for the
    # first publish). A release that failed at publishing is finished by
    # running the workflow again: rman asks the registry what is missing
    permissions:
      id-token: write
      contents: write
